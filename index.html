<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You ♡</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: 'Playfair Display', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 50%, rgba(245, 235, 230, 0.6) 0%, rgba(255, 255, 255, 1) 80%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 420px;
            padding: 20px;
            text-align: center;
        }

        /* Screen 1 */
        .screen-1 {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .screen-1.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            position: absolute;
        }

        .header-title {
            font-size: 1.6rem;
            color: #2b1e22;
            font-weight: 400;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }

        .heart-icon {
            font-size: 1.2rem;
            color: #C5A898;
            margin-bottom: 30px;
            display: inline-block;
            animation: softPulse 2s infinite ease-in-out;
        }

        @keyframes softPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .reveal-btn {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(197, 168, 152, 0.4);
            color: #2b1e22;
            padding: 14px 36px;
            font-size: 1rem;
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(197, 168, 152, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .reveal-btn:active {
            transform: scale(0.98);
        }

        /* Screen 2 */
        .screen-2 {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 380px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .screen-2.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(197, 168, 152, 0.3);
            padding: 45px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(197, 168, 152, 0.15);
            backdrop-filter: blur(12px);
        }

        .message-card p {
            font-size: 1.25rem;
            line-height: 1.8;
            color: #2b1e22;
            font-weight: 400;
            margin-bottom: 0;
        }

        .message-card p span {
            display: block;
        }

        .message-card .highlight {
            font-style: italic;
            margin-top: 15px;
            color: #9c6b74;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الشاشة الأولى -->
        <div class="screen-1" id="screen1">
            <h1 class="header-title">11.11 — A Special Day</h1>
            <div class="heart-icon">♥️</div>
            <button class="reveal-btn" onclick="revealMessage()">Tap to reveal</button>
        </div>

        <!-- الشاشة الثانية -->
        <div class="screen-2" id="screen2">
            <div class="message-card">
                <div class="heart-icon">♥️</div>
                <p>
                    Today is 11/11<br>
                    The 11th Day Of The 11th Month,<br>
                    <span class="highlight">And My Wish Will Always Be You❣️</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        function revealMessage() {
            const screen1 = document.getElementById('screen1');
            const screen2 = document.getElementById('screen2');

            screen1.classList.add('hidden');
            setTimeout(() => {
                screen2.classList.add('active');
            }, 300);
        }
    </script>
</body>
</html>
